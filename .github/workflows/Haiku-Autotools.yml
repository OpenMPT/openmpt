name: Haiku Autotools

on:
  push:
    branches: [ OpenMPT-1.32 ]

jobs:
  build:
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 'r1beta6', current: false }
          - { version: 'r1beta6', current: true  }

    concurrency:
      group: ${{github.ref}}-${{github.workflow}}-${{matrix.version}}-${{matrix.current}}-autotools
      cancel-in-progress: true

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Startup VM
      uses: cross-platform-actions/action@v1.8.0
      with:
        architecture: x86_64
        memory: 4G
        operating_system: haiku
        version: ${{matrix.version}}
        shell: bash
        sync_files: false
    - name: Sync files to VM
      shell: cpa.sh {0} --sync-files runner-to-vm
      run: true
    - name: Switch system to current
      if: matrix.current
      shell: cpa.sh {0} --sync-files none
      run: |
        yes yes | pkgman add-repo https://eu.hpkg.haiku-os.org/haiku/master/$(getarch)/current
        yes yes | pkgman add-repo https://eu.hpkg.haiku-os.org/haikuports/master/$(getarch)/current
    - name: Update system
      shell: cpa.sh {0} --sync-files none
      run: |
        pkgman refresh
        pkgman full-sync -y
    - name: Reboot VM
      shell: cpa.sh {0} --sync-files none --reboot
      run: true
    - name: Install dependencies
      shell: cpa.sh {0} --sync-files none
      run: |
        pkgman refresh
        pkgman install -y subversion git perl gawk make pkgconfig mpg123_devel libogg_devel libvorbis_devel flac_devel libsndfile_devel portaudio_devel libsdl2_devel autoconf autoconf_archive libtool libtool_libltdl doxygen help2man
    - name: Reboot VM
      shell: cpa.sh {0} --sync-files none --reboot
      run: true
    - name: Build
      shell: cpa.sh {0} --sync-files none
      run: |
        export MAKEFLAGS="-j4"; ./build/autotools/autoconfiscate.sh
