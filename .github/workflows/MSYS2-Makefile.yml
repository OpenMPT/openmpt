name: MSYS2 Makefile

on:
  push:
    branches: [ OpenMPT-1.31 ]

jobs:
  build:
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: UCRT64,  rep: ucrt64,  env: ucrt-x86_64 }
          - { sys: CLANG64, rep: clang64, env: clang-x86_64 }
    concurrency:
      group: ${{github.ref}}-${{github.workflow}}-${{matrix.sys}}-${{matrix.rep}}-${{matrix.env}}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: msys/autoconf ${{matrix.rep}}/mingw-w64-${{matrix.env}}-toolchain msys/autoconf-archive msys/automake ${{matrix.rep}}/mingw-w64-${{matrix.env}}-ccache ${{matrix.rep}}/mingw-w64-${{matrix.env}}-autotools ${{matrix.rep}}/mingw-w64-${{matrix.env}}-doxygen msys/gawk msys/help2man ${{matrix.rep}}/mingw-w64-${{matrix.env}}-libtool ${{matrix.rep}}/mingw-w64-${{matrix.env}}-git msys/p7zip msys/perl-XML-LibXML ${{matrix.rep}}/mingw-w64-${{matrix.env}}-pkgconf msys/subversion ${{matrix.rep}}/mingw-w64-${{matrix.env}}-unzip ${{matrix.rep}}/mingw-w64-${{matrix.env}}-xz msys/zip ${{matrix.rep}}/mingw-w64-${{matrix.env}}-clang ${{matrix.rep}}/mingw-w64-${{matrix.env}}-flac ${{matrix.rep}}/mingw-w64-${{matrix.env}}-libltdl ${{matrix.rep}}/mingw-w64-${{matrix.env}}-libogg ${{matrix.rep}}/mingw-w64-${{matrix.env}}-libsndfile ${{matrix.rep}}/mingw-w64-${{matrix.env}}-libvorbis ${{matrix.rep}}/mingw-w64-${{matrix.env}}-mpg123 ${{matrix.rep}}/mingw-w64-${{matrix.env}}-portaudio ${{matrix.rep}}/mingw-w64-${{matrix.env}}-pulseaudio ${{matrix.rep}}/mingw-w64-${{matrix.env}}-SDL2 ${{matrix.rep}}/mingw-w64-${{matrix.env}}-zlib
      - name: setup parallel make
        run: echo MAKEFLAGS=-j${NUMBER_OF_PROCESSORS} >> $GITHUB_ENV
      - name: make
        run: make
      - name: make check
        run: make check
